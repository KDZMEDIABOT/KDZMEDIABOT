# Development profile - runs on localhost, NO blue-green deployment
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${HTTPD_SERVER_PORT:8080}

# No blue-green in dev
bluegreen:
  enabled: false

# SSO disabled - all endpoints permit all
# spring.security.oauth2.resourceserver:
#   jwt:
#     issuer-uri: ${SSO_ISSUER_URI:}

logging:
  level:
    com.localmesalevel.aisystemtakeone: TRACE
    com.localmesalevel.aisystemtakeone.llm.service: TRACE
