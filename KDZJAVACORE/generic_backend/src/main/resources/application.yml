# Default configuration - delegates to profile-specific files
spring:
  profiles:
    default: dev
  application:
    name: aisystemtakeone
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${HTTPD_SERVER_PORT:8080}

article-generation:
  jobs:
    pool-size: ${article_generation_jobs_pool_size:${ARTICLE_GENERATION_JOBS_POOL_SIZE:5}}

research:
  deepresearch:
    mcp:
      server-name: ${RESEARCH_DEEPRESEARCH_MCP_SERVER_NAME:readingplus-deepresearch}
      bearer-token: ${RESEARCH_DEEPRESEARCH_MCP_BEARER_TOKEN:}
    max-steps: ${RESEARCH_DEEPRESEARCH_MAX_STEPS:8}
    default-user-id: ${RESEARCH_DEEPRESEARCH_DEFAULT_USER_ID:1}
