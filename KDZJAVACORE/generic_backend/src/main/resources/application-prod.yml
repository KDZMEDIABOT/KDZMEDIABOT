# Production profile - hosted at rig1.lan, WITH blue-green deployment

# Blue-green deployment enabled for production
bluegreen:
  enabled: true
  active-color: ${BLUE_GREEN_ACTIVE_COLOR:blue}
  idle-color: ${BLUE_GREEN_IDLE_COLOR:green}

# SSO configuration
sso:
  client-id: ${SSO_CLIENT_ID}
  client-secret: ${SSO_CLIENT_SECRET}
  issuer-uri: ${SSO_ISSUER_URI}

logging:
  level:
    org: TRACE
    com.localmesalevel.aisystemtakeone: TRACE
    com.localmesalevel.aisystemtakeone.llm.service: TRACE
    org.springframework.web: TRACE
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

bot:
  mcp:
    openserp:
      container-name: aisystem-openserp-mcp-sidecar-prod
