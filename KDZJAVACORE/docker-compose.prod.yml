# Production profile: Frontend + Backend + Auth sidecar (+ PostgreSQL).
# Run from project root:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# This file manages lifecycle only; place ingress/LB in front as needed.

services:
  redis:
    image: redis:7-alpine
    container_name: aisystem-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: ankane/pgvector:latest
    container_name: aisystem-postgres-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-aisystem_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No port exposure in prod if only backend connects internally

  #backend:
  #  build:
  #    context: .
  #    dockerfile: customer_project/Dockerfile
  #  container_name: aisystem-backend-prod
  #  restart: unless-stopped
  #  volumes:
  #    - /root/.m2:/root/.m2
  #    - /usr/bin/docker:/usr/bin/docker
  #    - /var/run/docker.sock:/var/run/docker.sock
  #  env_file:
  #    - .env.prod
  #  environment:
  #    SPRING_PROFILES_ACTIVE: prod
  #    HTTPD_SERVER_PORT: ${HTTPD_SERVER_PORT:-8443}
  #    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-aisystem_prod}
  #    SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
  #    SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  #    SSO_ISSUER_URI: ${SSO_ISSUER_URI:-}
  #    READINGPLUS_MCP_CONTAINER_NAME: aisystem-readingplus-mcp-sidecar-prod
  #  depends_on:
  #    postgres:
  #      condition: service_healthy
  #  expose:
  #    - "8443"

  auth_sidecar:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: aisystem-auth-sidecar-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      PORT: "3002"
      FRONTEND_URL: http://${SERVER_HOST:-rig1.lan}:8088
      AUTH_SERVICE_URL: http://${SERVER_HOST:-rig1.lan}:3002
      GENERIC_BACKEND_URL: http://${SERVER_HOST:-rig1.lan}:${HTTPD_SERVER_PORT:-8443}
      SESSION_SECRET: ${AUTH_SERVICE_SESSION_SECRET}
      AUTH_SESSION_STORE: ${AUTH_SESSION_STORE:-redis}
      AUTH_SERVICE_REDIS_URL: ${AUTH_SERVICE_REDIS_URL:-redis://redis:6379}
      AUTH_SERVICE_REDIS_PREFIX: ${AUTH_SERVICE_REDIS_PREFIX:-aisystem:auth:sess:}
      ISSUER_URI: ${SSO_ISSUER_URI:-}
      CLIENT_ID: ${SSO_CLIENT_ID:-}
      CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
    ports:
      - "0.0.0.0:3002:3002"
    depends_on:
      redis:
        condition: service_healthy
    # backend:
    #   condition: service_started

  readingplus_mcp_sidecar:
    image: python:3.11-slim
    container_name: aisystem-readingplus-mcp-sidecar-prod
    restart: unless-stopped
    stdin_open: true
    tty: true
    command: >
      sh -lc "
      pip install --no-cache-dir mcp==${READINGPLUS_MCP_PROTOCOL_VERSION:-1.1.0} mcp-server-ds==${READINGPLUS_MCP_SERVER_VERSION:-0.1.5} &&
      exec mcp-server-ds
      "
    environment:
      PYTHONUNBUFFERED: "1"
  #  depends_on:
  #    backend:
  #      condition: service_started

  openserp_mcp_sidecar:
    build:
      context: ./openserp-mcp
      dockerfile: Dockerfile
      args:
        OPENSERP_PROVIDER: ${OPENSERP_PROVIDER:-ddg}
    image: aisystem-openserp-mcp-sidecar:custom
    container_name: aisystem-openserp-mcp-sidecar-prod
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      PYTHONUNBUFFERED: "1"
      OPENSERP_API_KEY: ${OPENSERP_API_KEY:-}
      OPENSERP_PROVIDER: ${OPENSERP_PROVIDER:-ddg}
      OPENSERP_TIMEOUT: ${OPENSERP_TIMEOUT:-30}
      OPENSERP_HTTP_PORT: 7000
    # depends_on:
    #   backend:
    #   condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_SERVICE_URL: ${AUTH_SERVICE_PUBLIC_URL}
        SERVER_HOST: ${SERVER_HOST:-rig1.lan}
    container_name: aisystem-frontend-prod
    restart: unless-stopped
    environment:
      SERVER_HOST: ${SERVER_HOST:-rig1.lan}
      HTTPD_SERVER_PORT: ${HTTPD_SERVER_PORT:-8443}
    ports:
      - "0.0.0.0:${FRONTEND_HTTPD_PORT:-8088}:80"
    depends_on:
      - auth_sidecar
      - readingplus_mcp_sidecar
      #- backend

volumes:
  redis_prod_data:
  postgres_prod_data:
