# Production profile - hosted at rig1.lan, WITH blue-green deployment
spring:
  mvc:
    log-request-details: true
    log-resolved-exception: true
  security:
    enabled: false
    csrf:
      enabled: false
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://${SERVER_HOST:rig1.lan}:5432/customer_aisystem_prod
    username: ${DB_USERNAME:customer_prod}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

server:
  port: ${HTTPD_SERVER_PORT:8443}

# Blue-green deployment enabled for production
bluegreen:
  enabled: true
  active-color: ${BLUE_GREEN_ACTIVE_COLOR:blue}
  idle-color: ${BLUE_GREEN_IDLE_COLOR:green}

# SSO: validate JWT Bearer tokens (Passport.js auth service / IdP)
#spring.security.oauth2.resourceserver:
#  jwt:
#    issuer-uri: ${SSO_ISSUER_URI}

logging:
  level:
    org: INFO
    org.springframework.web: INFO
    com.customer1org.aisystem: INFO
    com.localmesalevel.aisystemtakeone: DEBUG
    com.localmesalevel.aisystemtakeone.llm.service: TRACE