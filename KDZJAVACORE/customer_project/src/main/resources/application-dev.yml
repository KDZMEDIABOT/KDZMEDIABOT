# Development profile - runs on localhost, NO blue-green deployment
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/aisystem_dev
    username: ${DB_USERNAME:cust1dev}
    password: ${DB_PASSWORD:cust1devpassw}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration/dev

server:
  port: ${HTTPD_SERVER_PORT:8081}

# No blue-green in dev
bluegreen:
  enabled: false

# SSO: validate JWT Bearer tokens. Set SSO_ISSUER_URI for real IdP; omit for dev without IdP.
spring.security.oauth2.resourceserver:
  jwt:
    issuer-uri: ${SSO_ISSUER_URI:}

logging:
  level:
    com.customer1org.aisystem: DEBUG
    com.localmesalevel.aisystemtakeone: TRACE
